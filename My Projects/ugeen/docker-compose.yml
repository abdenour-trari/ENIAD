version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${PORT:-3001}:3001"
    volumes:
      - ./downloads:/app/downloads
      - ./database:/app/database
      - ./.env:/app/.env
    environment:
      - NODE_ENV=production
      - HEADLESS=true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  downloads:
  database:
