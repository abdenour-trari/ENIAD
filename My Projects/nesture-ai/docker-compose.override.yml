# Development overrides — hot reload for both services
# Automatically applied when running: docker-compose up
version: "3.9"

services:
  backend:
    volumes:
      - ./backend/app:/app/app
      - ./backend/app/data:/app/data
    environment:
      - ENV=development
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8000
    stdin_open: true
    tty: true
