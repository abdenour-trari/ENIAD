  <body>
    <div class="appContainer">
      <div class="carreRouge" id="carreRouge"></div>
      <select name="" id="colorSelector" default="Chose">

        <option value="Blue">Bleu</option>
        <option value="red">Rouge</option>
        <option value="green">Vert</option>

      </select>
      <button id="changeColor">Canger la Couleur</button>
      <div>
        Longeur : <input type="number" id="Longeur" />
        <br />
        Largeur : <input type="number" id="Largeur" />
        <button id="changeSize">Changer la taille</button>
      </div>
      <button id="dispaly">Cacher</button>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
