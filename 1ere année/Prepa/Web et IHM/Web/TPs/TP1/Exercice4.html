<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercice 4</title>
    <style>
      * {
        margin: 0;
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS",
          sans-serif;
      }
      @media screen and (max-width: 750px) {
        .menu {
          flex-direction: column;
          width: 300px;
        }
      }
      .menu {
        display: flex;
        text-align: center;
        background-color: rgb(0, 205, 14);
        font-size: 30px;
        min-height: 80px;
        height: max-content;
      }
      .menu a {
        color: #eee;
        text-decoration: none;
        border: solid 1px black;
        flex: 1;
        align-content: center;
        min-height: 80px;
      }

      .rectangles {
        width: 400px;
        height: 400px;
        margin-top: 100px;
        margin-left: 100px;
        position: relative;
      }
      .rectangles div {
        height: 300px;
        width: 300px;
        position: absolute;
      }
      .div1 {
        border: solid 25px red;
        z-index: 4;
      }
      .div2 {
        border: solid 25px blue;
        z-index: 3;
        right: 0;
        bottom: 0;
      }
      .div3 {
        border: solid 25px green;
        z-index: 2;
        right: 0;
      }
      .div4 {
        border: solid 25px orange;
        z-index: 1;
        bottom: 0;
      }
    </style>
  </head>
  <body>
    <div class="menu">
      <a href="#">Accueil</a>
      <a href="#">Produits</a>
      <a href="#">Services</a>
      <a href="#">Equipe</a>
      <a href="#">Contact</a>
    </div>

    <div class="rectangles">
      <div class="div1"></div>
      <div class="div2"></div>
      <div class="div3"></div>
      <div class="div4"></div>
    </div>
  </body>
</html>
