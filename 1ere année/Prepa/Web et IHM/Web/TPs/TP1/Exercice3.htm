<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercice 3</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      header {
        background-color: royalblue;
        width: 100%;
        height: 200px;
      }
      .content {
        display: flex;
        flex: 1;
      }
      aside {
        background-color: orange;
        flex: 1;
      }
      main {
        flex: 4;
      }
      footer {
        background-color: rgb(137, 205, 35);
        width: 100%;
        height: 150px;
      }
    </style>
  </head>
  <body>
    <header></header>
    <div class="content">
      <aside></aside>
      <main></main>
      <aside></aside>
    </div>
    <footer></footer>
  </body>
</html>
